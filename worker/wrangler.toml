name            = "linkforge"
main            = "src/index.ts"
compatibility_date  = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

# ─── KV Namespace ─────────────────────────────────────────────────────────────
# Created via Cloudflare Dashboard → Workers & Pages → KV
[[kv_namespaces]]
binding = "LINKS_KV"
id      = "d42094ab250442ec82ba7cdea8afc573"

# ─── Environment Variables ────────────────────────────────────────────────────
[vars]
API_URL = "https://pivoturl.vercel.app"
# WORKER_SECRET is set via Cloudflare Dashboard (not in this file)

# ─── Local dev overrides ──────────────────────────────────────────────────────
[env.development]
[[env.development.kv_namespaces]]
binding = "LINKS_KV"
id = "d42094ab250442ec82ba7cdea8afc573"

[env.development.vars]
API_URL = "http://localhost:3000"
# WORKER_SECRET is loaded from .dev.vars for local dev
