name: URL Scanner — Scheduled Rescans

# Runs hourly to keep destination safety verdicts current.
# - Refreshes any verdicts stuck in 'pending' for over an hour.
# - Resubmits scans for verified/high links older than 7 days.
# - Resubmits scans for low/medium links older than 24 hours.
# Per-workspace + global quotas enforced server-side; the cron simply
# enqueues candidates up to a batch ceiling.

on:
  schedule:
    - cron: "0 * * * *" # every hour at :00
  workflow_dispatch:

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger rescan-due
        run: |
          if [ -z "$APP_URL" ] || [ -z "$INTERNAL_SECRET" ]; then
            echo "Missing APP_URL or INTERNAL_SECRET secrets"
            exit 1
          fi
          curl -fsS -X POST \
            -H "x-internal-secret: $INTERNAL_SECRET" \
            -H "Content-Type: application/json" \
            "$APP_URL/api/internal/url-scanner/rescan-due"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
