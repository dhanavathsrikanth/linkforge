name: Custom Domains — Status Sync

# Runs daily at 04:00 UTC to refresh Cloudflare hostname/SSL status for all
# verified custom domains and flag DNS drift (moved/deleted). Never suspends
# or deletes — drift only surfaces a dashboard banner.

on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC
  workflow_dispatch:

jobs:
  status-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger domain status sync
        run: |
          if [ -z "$APP_URL" ] || [ -z "$INTERNAL_SECRET" ]; then
            echo "Missing APP_URL or INTERNAL_SECRET secrets"
            exit 1
          fi
          curl -fsS -X POST \
            -H "x-internal-secret: $INTERNAL_SECRET" \
            -H "Content-Type: application/json" \
            "$APP_URL/api/internal/domains/status-sync"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
