name: Bio Analytics Flush

on:
  schedule:
    # Run every hour at :30 (offset from the link analytics flush at :00)
    - cron: '30 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  flush:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tsx
        run: npm install -g tsx

      - name: Run bio analytics flush
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BIO_ANALYTICS_KV_ID: ${{ secrets.BIO_ANALYTICS_KV_ID }}
          APP_URL: ${{ secrets.APP_URL }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: tsx scripts/flush-bio-analytics.ts
