name = "pivoturl-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# ─── Routes ───────────────────────────────────────────────────────────────────
# IMPORTANT: `routes` must be a TOP-LEVEL key, declared BEFORE any [table]
# header (like [vars] or [[kv_namespaces]]). If it appears after [vars], TOML
# parses it as a variable named "routes" instead of worker routes.
#
#   pivoturl.com/*    → bio pages, short links, bio API (DNS-only → Vercel,
#                       so in practice these bypass CF; kept for completeness)
#   *.pivoturl.com/*  → subdomains
#   */*               → Cloudflare for SaaS: catches ALL traffic entering the
#                       zone, including customer custom hostnames (acme.com)
#                       that CNAME to our fallback origin. The worker is the
#                       fallback origin. Ref: Cloudflare for SaaS →
#                       "Workers as your fallback origin".
routes = [
  { pattern = "pivoturl.com/*", zone_name = "pivoturl.com" },
  { pattern = "*.pivoturl.com/*", zone_name = "pivoturl.com" },
  { pattern = "*/*", zone_name = "pivoturl.com" },
]

# ─── Environment variables ────────────────────────────────────────────────────

[vars]
# Base URL of the Next.js app (no trailing slash)
API_URL = "https://pivoturl.com"

# ─── Secrets (set via: wrangler secret put WORKER_SECRET) ────────────────────
# WORKER_SECRET — shared secret between worker and Next.js /api/internal/* routes

# ─── KV Namespaces ────────────────────────────────────────────────────────────

# Short link cache (existing)
[[kv_namespaces]]
binding = "LINKS_KV"
id = "d42094ab250442ec82ba7cdea8afc573"
preview_id = "d42094ab250442ec82ba7cdea8afc573"

# Bio page HTML cache + domain→slug mapping + OG image cache
[[kv_namespaces]]
binding = "BIO_PAGES_KV"
id = "69e9003d8ba848739fee11abebf96795"
preview_id = "69e9003d8ba848739fee11abebf96795"

# Bio analytics event buffer + reaction rate limit counters
[[kv_namespaces]]
binding = "BIO_ANALYTICS_KV"
id = "d6eff93107bd446fb2dfd66ad5e6a9cc"
preview_id = "d6eff93107bd446fb2dfd66ad5e6a9cc"
